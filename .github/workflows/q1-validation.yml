name: Q1 leakage-safe validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run leakage-safe validation and QC
        run: |
          mkdir -p results/q1_validation
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          from analysis_pipeline import fit_validate, fairness_table, canonicalize

          data_path = Path('no_recommendation_dental_dataset_cleaned_keep_including_wisdom.csv')
          df = canonicalize(pd.read_csv(data_path))
          res = fit_validate(df)
          out = Path('results/q1_validation')
          out.mkdir(parents=True, exist_ok=True)

          payload = {
              'n_source_rows': res.n_source,
              'n_qc_eligible': res.n_eligible,
              'n_excluded_by_outcome_qc': res.n_source - res.n_eligible,
              'n_predictors': len(res.predictors),
              'predictors': res.predictors,
              'risk_bins_q34_q67': [float(x) for x in res.risk_bins],
              'metrics': res.metrics,
          }
          with open(out/'metrics.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2)

          res.oof.to_csv(out/'oof_predictions.csv', index=False)
          res.audit.to_csv(out/'target_arithmetic_qc.csv', index=False)
          pred_col = 'blend' if 'blend' in res.oof.columns else 'rf'
          fairness_table(df, res.oof, pred_col=pred_col).to_csv(out/'fairness_screen.csv', index=False)
          print(json.dumps(payload, indent=2))
          PY
      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-validation-results
          path: results/q1_validation/
          if-no-files-found: error
